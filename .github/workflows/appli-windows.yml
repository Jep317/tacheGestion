# Construit l'installateur Windows du panneau Tâches (dossier bureau/).
# Sur une demande de fusion : construction d'essai, rien n'est publié.
# Sur main : publication dans les « Releases » du dépôt ; les panneaux installés se mettent à jour tout seuls.
# Pour publier une nouvelle version, augmenter "version" dans bureau/package.json.
name: Appli Windows

on:
  push:
    branches: [main]
    paths: ['bureau/**', '.github/workflows/appli-windows.yml']
  pull_request:
    paths: ['bureau/**', '.github/workflows/appli-windows.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  construire:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: bureau
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bureau/package-lock.json
      - run: npm ci
      - name: Construire
        run: npx electron-builder --win --publish never
      - name: Vérifier les fichiers
        shell: bash
        run: ls -l dist/Taches-Installation.exe dist/Taches-Installation.exe.blockmap dist/latest.yml && cat dist/latest.yml
      # Publication en une seule fois avec gh : electron-builder lançait deux envois en parallèle
      # qui créaient chacun leur propre version, d'où des versions incomplètes.
      - name: Publier la version
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          V="v$(node -p "require('./package.json').version")"
          if gh release view "$V" >/dev/null 2>&1; then echo "$V déjà publiée"; exit 0; fi
          gh release create "$V" dist/Taches-Installation.exe dist/Taches-Installation.exe.blockmap dist/latest.yml \
            --title "Tâches pour Windows $V" --notes "Installateur du panneau Tâches." --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: Taches-Installation
          path: bureau/dist/Taches-Installation.exe
      # Paquet pour le Microsoft Store (signé par Microsoft au dépôt). Récupérable dans les artefacts de l'action.
      - name: Construire le paquet Microsoft Store
        run: npx electron-builder --win appx --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Taches-Store
          path: bureau/dist/Taches-Store.appx
      # Le paquet Store est aussi joint à la version publiée, pour le télécharger sans passer par GitHub Actions.
      - name: Joindre le paquet Store à la version
        if: github.event_name != 'pull_request'
        shell: bash
        run: gh release upload "v$(node -p "require('./package.json').version")" dist/Taches-Store.appx --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
