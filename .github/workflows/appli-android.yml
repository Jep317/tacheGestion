# Construit l'appli Android (widget Tâches, dossier android/).
# Sur une demande de fusion : construction d'essai, rien n'est publié.
# Sur main : l'APK remplace celui de la version « android » du dépôt, toujours à la même adresse :
# https://github.com/Jep317/tacheGestion/releases/download/android/Taches-Android.apk
# Cette version est marquée « préversion » pour ne pas devenir la « dernière version » :
# le panneau Windows se met à jour à partir de la dernière version et ne doit pas la voir.
name: Appli Android

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/appli-android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/appli-android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  construire:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Construire
        run: gradle assembleRelease --no-daemon --stacktrace
        env:
          VERSION_CODE: ${{ github.run_number }}
      - name: Renommer
        run: cp app/build/outputs/apk/release/app-release.apk Taches-Android.apk && ls -l Taches-Android.apk
      - name: Publier
        if: github.event_name != 'pull_request'
        run: |
          if gh release view android >/dev/null 2>&1; then
            gh release upload android Taches-Android.apk --clobber
          else
            gh release create android Taches-Android.apk --title "Tâches pour Android" \
              --notes "Appli Android avec le widget de l'écran d'accueil. Télécharger Taches-Android.apk sur le téléphone et l'ouvrir." \
              --prerelease --latest=false
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: Taches-Android
          path: android/Taches-Android.apk
